<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      updateCartQunantity();
    ">Show Quantity</button>

    <button onclick="
      console.log(addToCart(1))
    ">Add to Cart</button>

    <button onclick="
      console.log(addToCart(2))
    ">+2</button>

    <button onclick="
      console.log(addToCart(3))
    ">+3</button>

    <button onclick="
      console.log(addToCart(4))
    ">+4</button>

    <button onclick="
      console.log(addToCart(5))
    ">+5</button>

    <!-- vvv This code was changed. vvv -->
    <button onclick="
      console.log(removeFromCart(1))
    ">Remove from cart</button>

    <button onclick="
      console.log(removeFromCart(2))
    ">-2</button>

    <button onclick="
      console.log(removeFromCart(3))
    ">-3</button>
    <!-- ^^^ This code was changed. ^^^ -->

    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
      updateCartQunantity();
    ">Reset Cart</button><br><br>

    <p class="js-p"></p>

    <script>

        let cartQuantity = JSON.parse(localStorage.getItem('cartQuantity')) || 0; 

        updateCartQunantity();

        function addToCart (num){

            if (cartQuantity + num > 10) {
                alert('The cart is full');
                return;
            }
            cartQuantity = cartQuantity += num
            localStorage.setItem('cartQuantity', JSON.stringify(cartQuantity));
            //updateCartQunantity(); nëse du carti automatikish mu updetirat pa prek butonin
        }

        function removeFromCart (num){

            if (cartQuantity - num < 0) {
                alert('The cart cannot be below zero');
                return;
            }
            cartQuantity = cartQuantity -= num
            localStorage.setItem('cartQuantity', JSON.stringify(cartQuantity));
            //updateCartQunantity(); nëse du carti automatikish mu updetirat pa prek butonin
        }

        localStorage.setItem('cartQuantity', JSON.stringify(cartQuantity));

        function updateCartQunantity(){
            document.querySelector('.js-p').innerHTML = cartQuantity;
        }

        console.log(cartQuantity);
    </script>
  </body>
</html>
